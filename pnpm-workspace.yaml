packages:
  - apps/*

overrides:
  deepmerge-ts: '>=8.0.0'
  # GHSA-68fv-2mgg-jv7q: event-loop DoS, pulled in transitively by postcss/tailwind/vitest.
  source-map-js: '>=1.2.2'

  # Security fixes for high-severity dependency advisories
  '@modelcontextprotocol/server': '>=2.3.0'
  vite: '>=8.3.3'
  zod: '>=4.6.6'
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  undici: '>=7.30.1'
  effect: '>=3.22.1'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.1'
  - '@angular-devkit/core@22.2.1'
  - '@angular-devkit/schematics@22.2.1'
  - '@angular/build@22.2.1'
  - '@angular/cli@22.2.1'
  - '@angular/ssr@22.2.1'
  - '@schematics/angular@22.2.1'
  - '@better-auth/core@1.7.15'
  - '@better-auth/drizzle-adapter@1.7.15'
  - '@better-auth/kysely-adapter@1.7.15'
  - '@better-auth/memory-adapter@1.7.15'
  - '@better-auth/mongo-adapter@1.7.15'
  - '@better-auth/prisma-adapter@1.7.15'
  - '@better-auth/telemetry@1.7.15'
  - better-auth@1.7.15
